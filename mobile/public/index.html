<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Suivi d'exploitations agricoles et d'élevage au Sénégal : rapports de visite, photos, alertes et recommandations." />

    <!-- PWA : installation et apparence (couleurs de la charte TerraLink) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#305C41" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TerraLink" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #F4EFE6;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script src="/register-sw.js" defer></script>
  </head>

  <body>
    <noscript>
      Activez JavaScript pour utiliser TerraLink.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
